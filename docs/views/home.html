<!-- HOME view — the main screen: a grid of icons, the user's own projects first, then the examples
     grouped as the catalogue (samples/index.json) groups them. A fragment mounted by app.js in #view;
     the tiles are built by views/home.js. -->
  <style>
    /* The same values as the other views: they must be identical, not merely alike. */
    :root {
      --bg: #0f1117;
      --surface: #1a1d2e;
      --surface2: #242742;
      --border: #3a3f63;
      --text: #dde4ef;
      --text-dim: #a3adc4;
      --accent: #9ba1ff;
      --border-strong: #6b70ab;
      /* The ink on a generated tile: dark, because every tile colour is light enough to stand out from
         the page. The ratios are measured, not judged by eye — see home.js. */
      --tile-ink: #0f1117;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    body { padding-top: calc(var(--bar-h) + var(--inset-top)); }

    #home-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 150;
    }
    @media (max-width: 600px) { .bar-label { display: none; } }

    .home-wrap { max-width: 1100px; margin: 0 auto; padding: 8px 18px 64px; }
    .home-section h2 {
      margin: 26px 0 12px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-dim);
    }
    .tiles {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 16px 12px;
    }
    .tile {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 6px 2px;
      background: none;
      border: 0;
      border-radius: 14px;
      color: var(--text);
      font: 500 12.5px/1.25 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .tile .icon {
      width: 100%;
      max-width: 120px;
      aspect-ratio: 1;
      border-radius: 22%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--tile-ink);
      font: 700 30px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      letter-spacing: -0.02em;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
      transition: transform 0.12s;
    }
    .tile .icon img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .tile .name {
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      overflow-wrap: anywhere;
    }
    .tile:hover .icon { transform: scale(1.05); }
    .tile:hover .name { color: #fff; }
    .tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .empty { margin: 0; color: var(--text-dim); font-size: 14px; max-width: 60ch; }
  </style>

<div id="home-bar" class="app-bar">
  <a href="#/home" class="bar-logo" title="Home — the projects and the examples">Ollin</a>
  <span class="spacer"></span>
  <button id="hard-reload-btn" class="bar-btn" title="Reload with an empty cache (fetches the latest WASM)">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.6 8a5.6 5.6 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg>
    <span class="bar-label">Reload</span>
  </button>
  <a class="bar-btn" href="#/tutorial" title="The online help: the language, the modules, the tutorial">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="6.3"/><path d="M6.2 6.3a1.9 1.9 0 1 1 2.9 1.6c-.7.4-1.1.8-1.1 1.6"/><circle cx="8" cy="11.6" r=".5" fill="currentColor"/></svg>
    <span class="bar-label">Help</span>
  </a>
  <a class="bar-btn" href="#/playground" title="Open the playground">
    <svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
    <span class="bar-label">Playground</span>
  </a>
</div>

<main class="home-wrap" id="home-sections"></main>
