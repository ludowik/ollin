<!-- RUN view (standalone execution) — a fragment mounted by app.js in #view.
     The shared canvas, from the shell, is reparented into #output-pane by run.js. -->
  <style>
    /* The same values as the playground and the documentation: the three bars must be
       identical, not merely alike. */
    :root { --bg:#0f1117; --surface:#1a1d2e; --fg:#e6e6ee; --dim:#a3adc4; --accent:#9ba1ff; --border:#3a3f63; }
    * { box-sizing: border-box; }
    /* min-height:0 cancels the shell's min-height:100vh (on mobile, 100vh is the LARGE
       viewport, hence a window taller than the screen, which scrolls). overflow:hidden plus
       position:fixed make the app fill the window exactly, and nothing scrolls. */
    html, body { margin:0; height:100%; min-height:0; overflow:hidden; overscroll-behavior:none;
                 background:var(--bg); color:var(--fg);
                 font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    body { display:flex; flex-direction:column; position:fixed; top:0; right:0; bottom:0; left:0; }
    /* touch-action:none on the bar (a non-scrolling area) and on the canvas (an interactive
       graphics surface): a drag starting there has no scrollable ancestor, and iOS would
       otherwise pan the whole window. It is set directly on those elements, since touch-action
       is not inherited. #out keeps its native scrolling. */
    #bar, canvas { touch-action:none; }

    /* The bar's appearance, and the platform inset above it, are app-bar.css's: only its
       place in this view's column layout is set here — it is NOT part of the graphics area. */
    #bar { flex:none; }
    #status { color:var(--bar-ink); font-size:12px; }
    /* A narrow screen: icons only, the labels being too cramped. The bar's own tightening is
       shared, in app-bar.css. */
    @media (max-width: 600px) { .bar-label { display:none; } }

    /* The safe-area insets, for rounded corners and the home bar, are excluded from the area. */
    #stage-wrap { flex:1; display:flex; min-height:0;
                  padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    /* #output-pane is the GRAPHICS AREA that window.width and window.height measure. */
    #output-pane { flex:1; position:relative; overflow:hidden; min-width:0; min-height:0; }
    canvas { display:none; position:absolute; top:0; left:0; right:0; bottom:0; margin:auto; background:#000; }
    #out { display:none; position:absolute; inset:0; white-space:pre-wrap; overflow:auto;
           font-size:13px; line-height:1.5; padding:12px; }
    #out.err { color:#ff6b6b; }
    #out.ok  { color:#b8f5c0; }
  </style>

  <div id="bar" class="app-bar">
    <!-- "Ollin" on the left as in the other bars; the rest is set to the right:
         Reload, Restart, Capture, Pause, Editor. -->
    <span class="bar-logo">Ollin</span>
    <span class="spacer"></span>
    <span id="status">Loading…</span>
    <button id="reload-btn" class="bar-btn" title="Reload the page: a fresh WASM instance, the safe path">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.6 8a5.6 5.6 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg>
      <span class="bar-label">Reload</span>
    </button>
    <button id="relaunch-btn" class="bar-btn" title="Restart in the same WASM instance: fast, with no page reload">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5l9 5.5-9 5.5z"/></svg>
      <span class="bar-label">Restart</span>
    </button>
    <button id="shot-btn" class="bar-btn" title="Screenshot, stored as a PNG resource of the project">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="4" width="13" height="9.5" rx="1.5"/><circle cx="8" cy="8.75" r="2.6"/><path d="M5.5 4l1-1.5h3l1 1.5"/></svg>
      <span class="bar-label">Capture</span>
    </button>
    <button id="pause-btn" class="bar-btn" title="Pause / Resume">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="2.5" width="3.2" height="11" rx="1"/><rect x="9.3" y="2.5" width="3.2" height="11" rx="1"/></svg>
      <span class="bar-label">Pause</span>
    </button>
    <!-- Back to the editor: at the far RIGHT, in the same corner as the editor's "Full screen"
         button, so one corner makes the round trip. -->
    <a class="bar-btn" href="#/playground" title="Back to the editor">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9.5 3L5 8l4.5 5"/></svg>
      <span class="bar-label">Editor</span>
    </a>
  </div>
  <div id="stage-wrap">
    <div id="output-pane">
      <pre id="out"></pre>
    </div>
  </div>
