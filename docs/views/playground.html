<!-- The PLAYGROUND view — a fragment mounted by app.js into #view.
     The <style> is active only while mounted (innerHTML is replaced, so it cleans itself up).
     The <canvas> is shared, owned by the shell: app.js parks and yields it, and playground.js
     reparents it into #output-pane on init. -->
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0f1117;
  --surface: #1a1d2e;
  --surface2:#242742;
  --border:  #3a3f63;
  --text:    #dde4ef;
  --dim:     #a3adc4;
  --accent:  #9ba1ff;
  /* Ink laid ON an accented surface: the accent is light so as to stand out from the dark
     background, so white on top of it gave only 2.4:1 — unreadable. */
  --accent-ink: #0f1117;
  /* The outline of an INTERACTIVE element (button, field, selector), to be told apart from
     --border, which only separates areas: 3.6:1 against the surface, as a component requires. */
  --border-strong: #6b70ab;
  --green:   #4ade80;
  --red:     #f87171;
  --yellow:  #fbbf24;
  --blue:    #5b9bff;
  --mono:    'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace;
}

/* min-height:0 cancels the shell's `min-height:100vh` (index.html): on mobile, 100vh is the
   LARGE viewport, taller than the area visible under the browser's dynamic bar, which would
   make the body taller than the screen — the window would then scroll and the toolbar would
   escape upwards. overflow:hidden plus a column flex body keeps the toolbar wedged at the top,
   and only the inside scrolls. */
html, body { height: 100%; min-height: 0; overflow: hidden; overscroll-behavior: none; background: var(--bg); color: var(--text); font-family: system-ui,-apple-system,sans-serif; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
/* position:fixed takes the app out of the scrolling flow. Without it, on mobile, opening the
   keyboard (focusing the editor) scrolls the page upwards to keep the caret visible — which
   overflow:hidden does not prevent, the scroll being started by the browser and not by the
   user. Pinned to the window, the toolbar stays wedged at the top; the keyboard simply covers
   the bottom. */
body { display: flex; flex-direction: column; position: fixed; top: 0; right: 0; bottom: 0; left: 0; }
/* touch-action:none on the NON-scrolling areas (the toolbar, the file column's headers, the
   gutter). A drag starting in one of those has no scrollable ancestor, and iOS would otherwise
   bounce or pan the whole window.
   It is set DIRECTLY on those elements (touch-action is not inherited): a gesture starting
   there is blocked, without affecting the editor and output panes, which scroll normally,
   since they are not their descendants. */
#toolbar, .rail-head, #divider { touch-action: none; }

/* Mobile typing, with the keyboard open: the toolbar slides away to enlarge the editor.
   Brought back as soon as the keyboard closes (the class is set by playground.js). */
body.kbd-editing #toolbar { display: none; }

/* ── toolbar ─────────────────────────────────────────────────────────────── */
/* Appearance: app-bar.css, common to the three views.
   NO overflow here: overflow-x:auto would force overflow-y:auto and clip the drop-down menu,
   which is positioned below the bar. The icons-only mode (@media ≤1080px) is enough to fit
   everything. */

/* A wide toolbar in a narrow window: icons-only buttons keep everything visible (Run and Pause
   included) well before the switch to the mobile layout. */
@media (max-width: 1080px) {
  .btn-label { display: none; }
  #run-btn kbd { display: none; }
  #project-label { display: none; }
}

.sep { width: 1px; height: 20px; background: var(--border); }

#examples {
  background: var(--surface2);
  border: 1px solid var(--border-strong);
  color: var(--text);
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 5px;
  cursor: pointer;
  outline: none;
  max-width: 180px;
}
#examples:focus { border-color: var(--accent); }

.spacer { flex: 1; }

#status { font-size: 12px; color: var(--dim); }

/* The "Auto" toggle (automatic re-run) — revealed by JS, on every target. */
#autoexec-wrap { user-select: none; }
#autoexec-wrap input { margin: 0; width: 14px; height: 14px; cursor: pointer; accent-color: var(--accent); }
#autoexec-wrap.on { border-color: var(--accent); color: var(--accent); }

#run-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;   /* aligned with the bar buttons (app-bar.css) */
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s, border-color 0.15s, color 0.15s;
  flex-shrink: 0;
}
#run-btn:hover   { opacity: 0.85; }
#run-btn:disabled{ opacity: 0.4; cursor: default; }
#run-btn.running {
  background: transparent;
  border-color: var(--red);
  color: var(--red);
}
#run-btn.running:hover { opacity: 1; background: rgba(248,113,113,0.12); }

#stop-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 32px;   /* aligned with the bar buttons (app-bar.css) */
  background: transparent;
  border: 1px solid var(--red);
  color: var(--red);
  border-radius: 6px;
  padding: 0 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s, background 0.15s;
  flex-shrink: 0;
}
#stop-btn:disabled { opacity: 0.3; cursor: default; }
#stop-btn:not(:disabled):hover { background: rgba(248,113,113,0.12); }

#run-btn kbd {
  font-size: 10px;
  background: rgba(255,255,255,0.15);
  border-radius: 3px;
  padding: 1px 4px;
  font-family: var(--mono);
  font-weight: 400;
}

/* ── layout ──────────────────────────────────────────────────────────────── */
#layout {
  display: flex;
  flex: 1;            /* fills the space under the toolbar (a column flex body) */
  min-height: 0;      /* lets the inner panes scroll, rather than the window */
}

#editor-pane {
  flex: 1 1 50%;
  min-width: 0;
  min-height: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--border);
}

#editor-wrap {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
}

/* Make CM fill the pane */
#editor-wrap .cm-editor { height: 100%; border-radius: 0; border: none; }
#editor-wrap .cm-scroller { height: 100%; overflow: auto; }

/* The editor's scrollbar: a transparent track and a white bar. */
#editor-wrap .cm-scroller { scrollbar-width: thin; scrollbar-color: #ffffff transparent; }
#editor-wrap .cm-scroller::-webkit-scrollbar { width: 10px; height: 10px; background: transparent; }
#editor-wrap .cm-scroller::-webkit-scrollbar-track { background: transparent; }
#editor-wrap .cm-scroller::-webkit-scrollbar-corner { background: transparent; }
#editor-wrap .cm-scroller::-webkit-scrollbar-thumb {
  background: #ffffff; border-radius: 5px;
  border: 2px solid transparent; background-clip: padding-box;   /* a slight inset, so the thin bar stands off the edges */
}

#output-pane {
  flex: 1 1 50%;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  overflow: auto;
}



#output {
  flex: 1;
  padding: 16px 18px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.65;
  white-space: pre-wrap;
  word-break: break-all;
  overflow-y: auto;
  color: var(--dim);
  font-style: italic;
}
#output.ok  { color: var(--green); font-style: normal; }
#output.err { color: var(--red);   font-style: normal; }
/* A clickable "file:line" in an error message jumps to the offending line. */
#output .err-link { text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-weight: 600; }
#output .err-link:hover { background: rgba(255,255,255,0.08); border-radius: 3px; }

canvas#canvas {
  display: none;
  margin: auto;
}

/* ── divider (drag to resize) ─────────────────────────────────────────────── */
#divider {
  width: 5px;
  cursor: col-resize;
  background: var(--border);
  flex-shrink: 0;
  transition: background 0.15s;
  position: relative;
}
#divider:hover, #divider.dragging { background: var(--accent); }
/* A widened (invisible) grip area: the line stays thin, 5px, but the touch target extends
   20px on the EDITOR SIDE only, so it can be grabbed with a finger (an iPad…) without
   eating into the canvas's input surface, the output side being left flush. The divider,
   a later sibling of the editor, paints over it with no z-index. In column layout
   (mobile) the editor is above, so the overhang goes over its top. */
#divider::before {
  content: ''; position: absolute; top: 0; bottom: 0; left: -20px; right: 0;
}

/* ── the typing helper bar (symbols, touch) ────────────────────────────────── */
#kbar {
  display: none;               /* shown by JS (.show) when the editor takes focus, touch only */
  flex: none;
  align-items: center;
  justify-content: flex-end;   /* keys aligned to the right */
  gap: 6px;
  padding: 3px 8px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  overflow-x: auto;
  touch-action: pan-x;         /* the bar scrolls horizontally; the window does not pan */
  -webkit-overflow-scrolling: touch;
}
#kbar.show { display: flex; }
.kbar-key {
  flex: 0 0 auto;
  min-width: 38px;
  padding: 5px 0;
  background: var(--surface2);
  border: 1px solid var(--border-strong);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono);
  font-size: 15px;
  font-weight: 600;
  line-height: 1;
  cursor: pointer;
}
.kbar-key:active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* The Run button: pushed to the far right (margin auto) and accented — the toolbar being
   hidden while typing, it allows running without closing the keyboard. */
.kbar-run { margin-left: auto; background: var(--accent); color: var(--accent-ink); border-color: transparent; padding: 5px 14px; }

/* ── the help popup (shortcuts) ─────────────────────────────────────────────── */
#help-overlay {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(0, 0, 0, 0.5);
}
#help-overlay[hidden] { display: none; }
#help-modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  width: 100%;
  max-width: 560px;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
}
.help-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--surface);
}
.help-head h2 { margin: 0; font-size: 15px; font-weight: 600; color: var(--text); }
#help-close {
  background: transparent;
  border: none;
  color: var(--dim);
  font-size: 16px;
  cursor: pointer;
  padding: 2px 6px;
  border-radius: 4px;
}
#help-close:hover { color: var(--text); background: var(--surface2); }
#help-body { padding: 8px 18px 18px; }
.help-cat { margin-top: 16px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent); }
.help-row {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 16px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.help-row:last-child { border-bottom: none; }
.help-desc { color: var(--text); font-size: 13px; }
.help-keys { flex: 0 0 auto; white-space: nowrap; }
.help-keys kbd {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--text);
}
.help-keys .plus { color: var(--dim); font-size: 11px; margin: 0 2px; }

/* ── the sidebar toggle ────────────────────────────────────────────────────── */
/* An icon-only bar button (app-bar.css); only the "active" state is left here. */
#rail-toggle.active { color: var(--bar-accent); border-color: var(--bar-accent); }

/* ── the Project menu (drill-down) ─────────────────────────────────────────── */
#project-wrap { position: relative; }
/* A bar button (app-bar.css) with a SOLID BACKGROUND: it opens a menu and carries the sync
   badge, hence its prominence; its size stays that of the others. */
#project-btn { background: var(--surface2); color: var(--text); padding: 0 10px; }
#project-btn { position: relative; }
#project-btn:hover:not(:disabled) { border-color: var(--accent); }
#project-btn:disabled { opacity: 0.5; cursor: default; }
/* The GitHub sync badge (persistent, shown on mobile and desktop):
   blue = local changes to push (dirty) · green = in sync */
#project-btn.sync-local::after,
#project-btn.sync-syncing::after,
#project-btn.sync-ok::after {
  content: ''; position: absolute; top: -3px; right: -3px;
  width: 9px; height: 9px; border-radius: 50%;
  border: 2px solid var(--surface);
}
#project-btn.sync-local::after   { background: var(--blue); }
#project-btn.sync-syncing::after { background: var(--blue); animation: sync-pulse 1s ease-in-out infinite; }
#project-btn.sync-ok::after      { background: var(--green); }
@keyframes sync-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
#project-label { max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

#project-menu {
  display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 500;
  min-width: 240px; max-width: 320px; max-height: 70vh; overflow-y: auto;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
  box-shadow: 0 8px 28px rgba(0,0,0,0.45); padding: 5px;
}
.menu-header {
  display: flex; align-items: center; gap: 6px; padding: 6px 8px 8px;
  font-size: 11px; font-weight: 600; color: var(--dim); text-transform: uppercase; letter-spacing: 0.4px;
}
.menu-back {
  background: transparent; border: none; color: var(--accent); font-size: 18px; line-height: 1;
  cursor: pointer; padding: 0 4px; border-radius: 4px;
}
.menu-back:hover { background: var(--surface2); }
.menu-item {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%;
  background: transparent; border: none; color: var(--text); text-align: left;
  padding: 9px 10px; font-size: 13px; border-radius: 6px; cursor: pointer;
  /* The class also serves <a> elements (external links): without this they would be underlined. */
  text-decoration: none;
}
/* A long repository name used to wrap onto two lines on a narrow screen: one line, clipped if need be. */
.menu-item > span:first-child {
  min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.menu-item:hover { background: var(--surface2); }
.menu-arrow { color: var(--dim); font-size: 16px; }
.menu-sep { height: 1px; background: var(--border); margin: 5px 4px; }
.menu-empty { padding: 10px; font-size: 12px; color: var(--dim); font-style: italic; }
.menu-group { padding: 8px 10px 3px; font-size: 10.5px; font-weight: 600; color: var(--dim); letter-spacing: 0.3px; }
.menu-form { padding: 6px 10px 10px; display: flex; flex-direction: column; gap: 8px; }
.menu-info { font-size: 11.5px; color: var(--dim); line-height: 1.5; }
.menu-info a { color: var(--accent); text-decoration: none; }
.menu-info code { font-family: var(--mono); color: var(--text); font-size: 11px; }
.menu-input {
  background: var(--bg); border: 1px solid var(--border-strong); color: var(--text);
  border-radius: 6px; padding: 7px 9px; font-size: 12px; font-family: var(--mono); outline: none;
}
.menu-input:focus { border-color: var(--accent); }
.menu-check {
  display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--dim);
  cursor: pointer; user-select: none;
}
.menu-btn {
  background: var(--accent); color: var(--accent-ink); border: none; border-radius: 6px;
  padding: 7px 10px; font-size: 12.5px; font-weight: 600; cursor: pointer;
}
.menu-btn:disabled { opacity: 0.6; cursor: default; }
.menu-err { font-size: 11.5px; color: var(--red); }

/* ── the side list of files ────────────────────────────────────────────────── */
#editor-main { flex: 1; min-height: 0; display: flex; }
#editor-wrap { flex: 1; min-width: 0; }

/* ── a resource preview (in the editor's place) ────────────────────────────── */
#res-view {
  flex: 1; min-width: 0; min-height: 0; overflow: auto;
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 16px; background: var(--bg);
}
#res-view .res-head {
  display: flex; align-items: center; gap: 10px; width: 100%;
  font-size: 12px; color: var(--muted);
}
#res-view .res-name { color: var(--text); font-weight: 600; overflow-wrap: anywhere; }
#res-view .res-sp { flex: 1; }
/* The checkerboard: without it, an image with a transparent background would blend into the panel. */
#res-view .res-frame {
  max-width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px;
  background-color: #1b1b22;
  background-image: linear-gradient(45deg, #24242c 25%, transparent 25%, transparent 75%, #24242c 75%),
                    linear-gradient(45deg, #24242c 25%, transparent 25%, transparent 75%, #24242c 75%);
  background-size: 16px 16px; background-position: 0 0, 8px 8px;
}
#res-view img { display: block; max-width: 100%; image-rendering: pixelated; }
#res-view .res-note { font-size: 12px; color: var(--muted); text-align: center; }
#file-rail {
  width: 172px; flex-shrink: 0; display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--border); overflow: hidden;
}
#file-rail.rail-hidden { display: none; }   /* closed from the first render, so there is no flash */
.rail-head {
  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
  padding: 8px 10px; font-size: 11px; font-weight: 600; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 1px solid var(--border);
}
.rail-head-res { border-top: 1px solid var(--border); }
.rail-head button {
  background: transparent; border: none; color: var(--accent); font-size: 16px; line-height: 1;
  cursor: pointer; padding: 0 4px; border-radius: 4px;
}
.rail-head button:hover { background: var(--surface2); }
#file-list { flex: 1 1 auto; overflow-y: auto; padding: 4px; }
#res-list  { flex: 0 1 40%; overflow-y: auto; padding: 4px; }
#gh-rail { border-bottom: 1px solid var(--border); }
#gh-rail-body { padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; }
.gh-repo { font-size: 11px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rail-empty { padding: 6px 8px; font-size: 12px; color: var(--dim); font-style: italic; }
.file-item {
  display: flex; align-items: center; justify-content: space-between; gap: 4px;
  padding: 6px 8px; border-radius: 5px; cursor: pointer; font-size: 12.5px;
  font-family: var(--mono); color: var(--text); white-space: nowrap; overflow: hidden;
}
.file-item:hover { background: var(--surface2); }
.file-item.active { background: var(--surface2); box-shadow: inset 2px 0 0 var(--accent); }
.file-name { overflow: hidden; text-overflow: ellipsis; }
.file-item.entry .file-name { color: var(--accent); }
.file-acts { display: none; flex-shrink: 0; }
.file-item:hover .file-acts, .file-item.active .file-acts { display: inline-flex; gap: 1px; }
.file-act {
  background: transparent; border: none; color: var(--dim); cursor: pointer;
  font-size: 11px; padding: 1px 3px; border-radius: 3px;
}
.file-act:hover { background: var(--border); color: var(--text); }

/* ── mobile ──────────────────────────────────────────────────────────────── */
@media (max-width: 640px) {
  #layout { flex-direction: column; }
  #file-rail { width: 116px; }
  #project-label { max-width: 84px; }
  #project-menu { min-width: 220px; max-width: 82vw; }
  .file-acts { display: inline-flex; gap: 1px; }   /* tactile : actions toujours visibles */
  #editor-pane { flex: 1 1 55%; border-right: none; border-bottom: 1px solid var(--border); }
  #output-pane { flex: 1 1 45%; min-height: 0; overflow: hidden; }
  #divider { width: 100%; height: 6px; cursor: row-resize; }
  #divider::before { top: -20px; bottom: 0; left: 0; right: 0; }

  /* A smaller font — maximum-scale=1.0 in the viewport prevents iOS from zooming */
  #editor-wrap .cm-editor  { font-size: 12px; }
  #editor-wrap .cm-content { font-size: 12px; }
  /* Scroll horizontal fluide sur iOS */
  #editor-wrap .cm-scroller { overflow-x: auto; -webkit-overflow-scrolling: touch; }

  /* A compact bar: the tightening is common (app-bar.css); what is specific to the
     playground lives here — labels, shortcut and status hidden, and a tighter Run button. */
  .btn-label { display: none; }
  #run-btn kbd { display: none; }
  #status { display: none; }
  #run-btn, #stop-btn { padding: 0 8px; }
}
</style>

<div id="toolbar" class="app-bar">
  <a href="#/tutoriel" class="bar-logo">Ollin</a>
  <button id="rail-toggle" class="bar-btn icon-only" title="Show / hide the files">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="2.5" width="13" height="11" rx="1.5"/><line x1="6" y1="2.5" x2="6" y2="13.5"/></svg>
  </button>
  <div id="project-wrap">
    <button id="project-btn" class="bar-btn" title="Projects" disabled aria-haspopup="true" aria-expanded="false">
      <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1.5 4.5A1 1 0 012.5 3.5H6l1.5 1.5H13.5a1 1 0 011 1v6a1 1 0 01-1 1h-11a1 1 0 01-1-1z"/></svg>
      <span id="project-label" class="btn-label">Project</span>
      <svg width="9" height="9" viewBox="0 0 16 16" fill="currentColor"><path d="M3 6l5 5 5-5z"/></svg>
    </button>
    <div id="project-menu" role="menu"></div>
  </div>
  <div class="spacer"></div>
  <span id="status">Loading…</span>
  <button id="reload-btn" class="bar-btn" title="Reload with an empty cache (fetches the latest WASM; the code is kept)">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M13.6 8a5.6 5.6 0 1 1-1.6-3.9"/><path d="M13.5 2v3h-3"/></svg>
    <span class="btn-label">Reload</span>
  </button>
  <button id="format-btn" class="bar-btn" title="Reformat the code (indentation) - Alt+Shift+F">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 3.5h12M6 6.5h8M6 9.5h8M2 12.5h12"/></svg>
    <span class="btn-label">Format</span>
  </button>
  <button id="copy-btn" class="bar-btn" title="Copy the code">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
    <span class="btn-label">Copy</span>
  </button>
  <label id="autoexec-wrap" class="bar-btn" title="Re-run automatically 2 s after the last edit" style="display:none">
    <input type="checkbox" id="autoexec-chk">
    <span class="btn-label">Auto</span>
  </label>
  <button id="run-btn" disabled>
    <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
    <span class="btn-label">Run</span><kbd>Alt+↵</kbd>
  </button>
  <button id="stop-btn" disabled title="Pause / Resume" style="display:none">
    <svg width="10" height="10" viewBox="0 0 16 16" fill="currentColor"><rect x="2" y="2" width="4" height="12" rx="1"/><rect x="10" y="2" width="4" height="12" rx="1"/></svg>
    <span class="btn-label">Pause</span>
  </button>
  <button id="standalone-btn" class="bar-btn" title="Run full screen, in a page of its own">
    <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 2H2v4M10 2h4v4M6 14H2v-4M10 14h4v-4"/></svg>
    <span class="btn-label">Full screen</span>
  </button>
</div>

<div id="layout">
  <div id="editor-pane">
    <div id="editor-main">
      <aside id="file-rail" class="rail-hidden">
        <div id="gh-rail" style="display:none">
          <div class="rail-head">
            <span>GitHub</span>
          </div>
          <div id="gh-rail-body"></div>
        </div>
        <div class="rail-head">
          <span>Files</span>
          <button id="new-file-btn" title="New file">＋</button>
        </div>
        <div id="file-list"></div>
        <div class="rail-head rail-head-res">
          <span>Resources</span>
          <button id="new-res-btn" title="Add an image">＋</button>
        </div>
        <div id="res-list"></div>
        <input type="file" id="img-file-input" accept="image/png,image/jpeg,image/gif,image/webp,image/bmp,.obj,.glb,.gltf" multiple style="display:none">
      </aside>
      <div id="editor-wrap"></div>
      <!-- A resource preview: it takes the editor's place (same parent, same flex). -->
      <div id="res-view" style="display:none"></div>
    </div>
  </div>
  <div id="divider" style="display:none"></div>
  <div id="output-pane" style="display:none">
    <div id="output">Ready.</div>
  </div>
</div>

<!-- The typing helper bar (symbols) — shown by JS when the editor takes focus on a touch
     device. The last child, so the bottom of the app is just above the keyboard (thanks to
     the visualViewport alignment). data-ins = the text inserted,
     data-back = how far the caret steps back (pairs: the caret sits between the two). -->
<div id="kbar" aria-hidden="true">
  <button class="kbar-key" data-ins="()" data-back="1">(</button>
  <button class="kbar-key" data-ins="[]" data-back="1">[</button>
  <button class="kbar-key" data-ins="{}" data-back="1">{</button>
  <button class="kbar-key" data-ins="=" data-back="0">=</button>
  <button class="kbar-key" data-move="-1" aria-label="Caret left">←</button>
  <button class="kbar-key" data-move="1" aria-label="Caret right">→</button>
  <button class="kbar-key kbar-run" data-run="1" aria-label="Run">▶</button>
</div>

<!-- The help popup: keyboard shortcuts. Opened by the "Help" button or F1.
     Its content (#help-body) is rendered by JS from the SHORTCUTS list. -->
<div id="help-overlay" hidden>
  <div id="help-modal" role="dialog" aria-modal="true" aria-labelledby="help-title">
    <div class="help-head">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <button id="help-close" title="Close (Esc)" aria-label="Close">✕</button>
    </div>
    <div id="help-body"></div>
  </div>
</div>
